services:
  db:
    image: postgres:16-alpine
    container_name: bookflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookflow}
      POSTGRES_USER: ${POSTGRES_USER:-bookflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bookflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookflow} -d ${POSTGRES_DB:-bookflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookflow_postgres_data:
