# Railway service configuration for the FastAPI API.
# Provision PostgreSQL and Redis as separate Railway services and inject their
# private connection URLs as DATABASE_URL and REDIS_URL.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "sh -c 'uv run --no-sync alembic -c alembic.ini upgrade head && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
